<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>力与加速度 · 内置示例</title><!--TEACH_MATH--><style>*{box-sizing:border-box}body{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#193e35;background:#f6f9f6;margin:0;padding:24px}main{max-width:950px;margin:auto}h1{font-size:28px;margin-top:0}.label{color:#73887c;font-size:12px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}.stage,.controls{border:1px solid #d9e4da;border-radius:14px;background:white;padding:22px}.apparatus{display:flex;align-items:center;justify-content:center;min-height:340px}label{display:block;margin:18px 0;font-size:16px}input{width:100%;margin-top:14px;accent-color:#177562}#formula{font-size:19px;margin:22px 0;overflow:auto}p{line-height:1.9}button{padding:10px 15px;background:#177562;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer}.quiz{border-top:1px solid #dde6de;margin-top:22px;padding-top:20px}#answer{font-weight:bold;color:#196853}output{font-weight:bold;color:#177562}#bar{height:12px;background:#dfede4;border-radius:6px;overflow:hidden}#bar div{background:#249179;height:100%;width:50%;transition:width .15s}@media(max-width:600px){body{padding:16px}.layout{grid-template-columns:1fr}.apparatus{min-height:270px}}</style></head><body><main><p class="label">内置示例 · 简化模型：水平方向忽略摩擦，拉力就是合力</p><h1>力大了，加速度怎样变？</h1><p>先固定质量，改变拉力，再固定拉力改变质量。测力计读数与右侧的力同步变化。</p><div class="layout"><section class="stage"><div class="apparatus">{{component:phy.apparatus.spring-scale.interactive}}</div></section><section class="controls"><label>合力 F：<output id="force-value">2.5 N</output><input id="force" type="range" min="0" max="5" step="0.1" value="2.5" aria-label="合力"></label><label>质量 m：<output id="mass-value">1.0 kg</output><input id="mass" type="range" min="0.5" max="5" step="0.1" value="1" aria-label="质量"></label><div id="formula"></div><p>加速度：<output id="acceleration">2.50 m/s²</output></p><div id="bar"><div id="bar-value"></div></div><p id="observation"></p><button id="reset">恢复初始状态</button></section></div><section class="quiz"><b>想一想：合力为零，就一定静止吗？</b><p><button id="reveal">看解释</button></p><p id="answer" hidden>不一定。合力为零时加速度为零，物体也可能做匀速直线运动。</p></section></main><script>
document.addEventListener('DOMContentLoaded',()=>{const $=s=>document.querySelector(s);function update(){const f=Number($('#force').value),m=Number($('#mass').value),a=f/m;$('#force-value').textContent=f.toFixed(1)+' N';$('#mass-value').textContent=m.toFixed(1)+' kg';$('#acceleration').textContent=a.toFixed(2)+' m/s²';$('#bar-value').style.width=(a/10*100)+'%';updateComponent('phy.apparatus.spring-scale.interactive',{force:f,maxForce:5,size:300});renderFormula($('#formula'),'a=\\frac{F}{m}=\\frac{'+f.toFixed(1)+'}{'+m.toFixed(1)+'}='+a.toFixed(2)+'\\,\\mathrm{m/s^2}');$('#observation').textContent=f===0?'此时加速度为零；速度是否为零，需要看物体原来的运动状态。':'固定质量时增大合力，加速度会增大；固定合力时增大质量，加速度会减小。';}$('#force').oninput=update;$('#mass').oninput=update;$('#reset').onclick=()=>{$('#force').value=2.5;$('#mass').value=1;update();};$('#reveal').onclick=()=>{$('#answer').hidden=false;};update();});
</script></body></html>
